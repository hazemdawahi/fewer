name: release
# A version tag (v1.0.0) builds Fewer's two programs for each system and publishes them, with
# get.sh as the release's install.sh, so that one line installs Fewer with nothing else needed:
#   curl -fsSL https://github.com/hazemdawahi/fewer/releases/latest/download/install.sh | sh
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-14, target: x86_64-apple-darwin }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust for ${{ matrix.target }}
        run: rustup target add ${{ matrix.target }}
      - name: musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build fewer-pack
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Build fewer
        run: cargo build --release --locked --target ${{ matrix.target }}
        working-directory: search
      - name: Check they run
        if: matrix.target != 'x86_64-apple-darwin'
        run: |
          search/target/${{ matrix.target }}/release/fewer --version
          target/${{ matrix.target }}/release/fewer-pack --version
      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/fewer-pack search/target/${{ matrix.target }}/release/fewer dist/
          tar -C dist -czf fewer-${{ matrix.target }}.tar.gz fewer fewer-pack
      - uses: actions/upload-artifact@v4
        with:
          name: fewer-${{ matrix.target }}
          path: fewer-${{ matrix.target }}.tar.gz
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp get.sh dist/install.sh
          (cd dist && sha256sum *.tar.gz install.sh > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* --title "Fewer ${GITHUB_REF_NAME#v}" --notes "One line installs it: \`curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.sh | sh\`. What is new: CHANGELOG.md."
